name: Test

# CI deliberately uses pip + maturin rather than the Nix flake: the flake
# pins nixpkgs-unstable, whose Python package set is rarely fully covered
# by the binary cache, so `nix develop` on a fresh runner builds
# matplotlib/jupyter/etc. from source (~25 min per job). The flake remains
# the supported local dev environment; CI optimizes for feedback time
# (~3-5 min cold, less with warm caches).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (builds Rust extension via maturin)
        run: pip install -e ".[dev,charts,rust]"
      # No data download here: the default suite is designed to pass without
      # the SPY dataset (data-dependent tests skip themselves). SPY-gated
      # tests run in the article-reproduction job below, with caching.
      - name: Lint
        run: python -m ruff check options_portfolio_backtester tests scripts research
      - name: Run tests
        run: python -m pytest -v tests/ --ignore=tests/heavy --ignore=tests/oracles/test_article_reproduction.py
      - name: Type check
        # Stubs and mypy pinned: a new pandas-stubs release routinely adds
        # errors for unchanged code, which should be a deliberate upgrade.
        run: |
          pip install "mypy==2.1.0" "pandas-stubs==2.2.3.250527"
          python -m mypy options_portfolio_backtester --ignore-missing-imports

  # Gate merges on the published-article numbers and the data-dependent
  # invariants. Runs as its own job so the fast unit-test job above is not
  # slowed by the ~630MB pinned SPY dataset download or the longer suites.
  article-reproduction:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (builds Rust extension via maturin)
        run: pip install -e ".[dev,charts,rust]"

      - name: Restore pinned SPY dataset cache
        id: data-cache
        uses: actions/cache@v5
        with:
          # Cache only what the tests read: the engine-ready options parquet
          # plus the stocks csv/parquet (~600MB total). The 3.3GB
          # options.csv is deliberately excluded — it is deleted after the
          # fetch step and never cached.
          path: |
            data/processed/options.parquet
            data/processed/stocks.csv
            data/processed/stocks.parquet
          # Key is derived from the canonical SHA-256 hashes pinned in
          # scripts/fetch_data.py (CANONICAL_HASHES, data-v1 release):
          #   SPY_options.parquet    a7152991b45b...
          #   SPY_underlying.parquet 847e60a441eb...
          # plus the fetch date range below. Bump this key manually whenever
          # the data-v1 release (and its hashes in fetch_data.py) changes.
          key: spy-data-v1-a7152991-847e60a4-2008-01-02-2024-12-31

      - name: Download pinned SPY dataset
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_data.py all --symbols SPY --start 2008-01-02 --end 2024-12-31

      - name: Remove options.csv (tests read options.parquet; keeps cache and disk small)
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: rm -f data/processed/options.csv

      - name: Verify published-article reproductions
        # If a backtester change moves a published-article number by more
        # than the test's tolerance, this step fails and the PR needs
        # either an article-side update or a backtester-side review.
        run: python -m pytest tests/oracles/test_article_reproduction.py -q

      - name: Run data-dependent invariant tests
        # Some test classes skip themselves when generated-data files are
        # absent; that is expected in CI.
        run: python -m pytest tests/heavy/test_invariants.py -q -o addopts=""
